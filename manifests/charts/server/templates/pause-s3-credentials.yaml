{{- /*
The s3-workspace pause backend reads its object-store credentials from a
Secret that must live in the SANDBOX namespace (the server projects it into
sandbox pods and pause jobs there), which is usually not this chart's own
namespace — hence the separate namespaceOverride. Creation is opt-in: leave
pauseS3Credentials.create false and manage the Secret out-of-band (kubectl,
sealed-secrets, external-secrets) when the values file cannot hold secrets.
*/ -}}
{{- if .Values.pauseS3Credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pauseS3Credentials.name }}
  namespace: {{ .Values.pauseS3Credentials.namespace }}
  labels:
    {{- include "opensandbox-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: pause-s3-credentials
type: Opaque
stringData:
  accessKeyId: {{ .Values.pauseS3Credentials.accessKeyId | quote }}
  secretAccessKey: {{ .Values.pauseS3Credentials.secretAccessKey | quote }}
{{- end }}
